server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://cerveau-du-parieur-production.up.railway.app/api/;
        proxy_set_header Host cerveau-du-parieur-production.up.railway.app;
        proxy_ssl_server_name on;
    }
}
